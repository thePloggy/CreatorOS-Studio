<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-sil.svg" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/favicon-sil.png" />
    <!-- No user-scalable=no: Safari ignores it and it breaks accessibility.
         Page zoom is blocked by touch-action (index.css); only the full-size
         media stays pinch-zoomable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable web app, without a service worker (a stale cache would
         keep serving a broken build). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CreatorOS Studio" />
    <title>CreatorOS Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

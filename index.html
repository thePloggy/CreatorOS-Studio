<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-sil.svg" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/favicon-sil.png" />
    <!-- Pas de user-scalable=no : Safari l’ignore et il casse l’accessibilité.
         Le zoom de page est bloqué par touch-action (index.css) ; seul le média
         en grand reste pinçable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Web app installable (sans service worker : voir TODO §14 — un cache
         mal purgé servirait une version cassée même après correction). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CreatorOS Studio" />
    <title>CreatorOS Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
